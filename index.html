<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Melissa's Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg: #1f1420;
    --bg-deep: #170e18;
    --surface: #2b1e2e;
    --surface-raised: #362539;
    --hairline: #4a3750;
    --cream: #f3ead9;
    --cream-dim: #cabfae;
    --gold: #e8a93c;
    --gold-dim: #c98f2c;
    --rose: #c4607a;
    --sage: #7fa37a;
    --slate: #7b93b0;
    --danger: #d9666a;
    --radius: 14px;
    --radius-sm: 8px;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .num{ font-family: 'IBM Plex Mono', monospace; font-feature-settings: "tnum"; }

  /* Header */
  header.top{
    padding: 18px 18px 14px;
    background: linear-gradient(180deg, var(--bg-deep), var(--bg));
    border-bottom: 1px solid var(--hairline);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .brand-row{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 22px;
    letter-spacing: 0.2px;
    color: var(--cream);
    line-height: 1.25;
  }
  .brand .dot{ color: var(--gold); }
  .sync-btn{
    background:none; border:1px solid var(--hairline); color: var(--cream-dim);
    font-family:'IBM Plex Mono',monospace; font-size:10px; padding:6px 9px;
    border-radius: 20px; display:flex; align-items:center; gap:5px; cursor:pointer;
  }
  .sync-btn:active{ transform: scale(0.96); }
  .sync-dot{ width:6px; height:6px; border-radius:50%; background:var(--sage); flex-shrink:0; }
  .sync-dot.busy{ background: var(--gold); animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .subtitle{ font-size:11px; color: var(--cream-dim); margin-top:2px; letter-spacing:0.3px; }

  main{ flex:1; padding: 16px 16px 100px; overflow-x:hidden; }

  /* Category tag colors */
  .tag{
    display:inline-block; font-size:10.5px; font-weight:600; letter-spacing:0.3px;
    padding: 3px 9px; border-radius: 20px; text-transform: uppercase;
  }
  .tag-0{ background: rgba(123,147,176,0.18); color:#a9c0dd; }
  .tag-1{ background: rgba(196,96,122,0.18); color:#e4a2b4; }
  .tag-2{ background: rgba(127,163,122,0.2); color:#a9cba5; }
  .tag-3{ background: rgba(232,169,60,0.18); color:#f2c264; }
  .tag-4{ background: rgba(150,120,200,0.18); color:#c3aee8; }

  /* Section headers */
  .section-title{
    font-family:'Fraunces', serif; font-weight:600; font-size:17px; color:var(--cream);
    margin: 4px 0 12px;
  }
  .muted{ color: var(--cream-dim); }

  /* Cards */
  .card{
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }

  /* Inputs */
  input[type=text], input[type=number], select{
    width:100%; background: var(--bg-deep); border:1px solid var(--hairline);
    color: var(--cream); font-family:'Inter',sans-serif; font-size:15px;
    padding: 11px 12px; border-radius: var(--radius-sm); outline:none;
  }
  input::placeholder{ color: #6f6274; }
  input:focus, select:focus{ border-color: var(--gold-dim); }
  label{ font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--cream-dim); display:block; margin-bottom:6px; }
  .field{ margin-bottom: 12px; }
  .field-row{ display:flex; gap:10px; }
  .field-row > .field{ flex:1; }

  .chip-group{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    border:1px solid var(--hairline); background: var(--bg-deep); color:var(--cream-dim);
    padding: 9px 14px; border-radius: 20px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .chip.active{ background: var(--gold); border-color: var(--gold); color: #241705; }

  /* Product row in New Sale */
  .product-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 11px 0; border-bottom: 1px solid var(--hairline);
    gap: 10px;
  }
  .product-row:last-child{ border-bottom:none; }
  .p-info{ flex:1; min-width:0; }
  .p-name{ font-size:14px; font-weight:500; color:var(--cream); line-height:1.3; }
  .p-meta{ font-size:11.5px; color:var(--cream-dim); margin-top:2px; }
  .p-meta.low{ color: var(--danger); font-weight:600; }
  .stepper{ display:flex; align-items:center; gap:0; flex-shrink:0; }
  .step-btn{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--hairline);
    background: var(--bg-deep); color:var(--cream); font-size:16px; display:flex;
    align-items:center; justify-content:center; cursor:pointer; user-select:none;
  }
  .step-btn:disabled{ opacity:0.3; }
  .step-btn:active:not(:disabled){ background: var(--surface-raised); }
  .step-count{ width:28px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:14px; }

  /* Receipt / ticket component - signature element */
  .receipt{
    background: #fbf6ea;
    color: #2a2118;
    border-radius: 4px;
    padding: 18px 16px 16px;
    position: relative;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .receipt::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-9px; height:16px;
    background:
      linear-gradient(-45deg, #fbf6ea 8px, transparent 0) 0 8px,
      linear-gradient(45deg, #fbf6ea 8px, transparent 0) 0 8px;
    background-size: 16px 16px;
    background-repeat: repeat-x;
  }
  .receipt-head{ text-align:center; font-family:'Fraunces',serif; font-weight:600; font-size:15px; letter-spacing:0.5px; border-bottom: 1px dashed #b9ac8f; padding-bottom:10px; margin-bottom:10px; }
  .receipt-head small{ display:block; font-family:'IBM Plex Mono',monospace; font-weight:400; font-size:10px; color:#7a6d55; margin-top:3px; text-transform:uppercase; letter-spacing:1px; }
  .receipt-line{ display:flex; justify-content:space-between; font-size:13px; padding:3px 0; font-family:'IBM Plex Mono',monospace; }
  .receipt-line .ln-name{ font-family:'Inter',sans-serif; color:#3a2f21; }
  .receipt-total{ display:flex; justify-content:space-between; border-top:1px dashed #b9ac8f; margin-top:8px; padding-top:8px; font-weight:700; font-size:15px; }
  .receipt-foot{ text-align:center; font-size:10px; color:#8a7c62; margin-top:10px; letter-spacing:1px; text-transform:uppercase; }

  .sticky-bottom{
    position: sticky; bottom: 0; z-index: 10;
    background: linear-gradient(0deg, var(--bg) 60%, transparent);
    padding-top: 10px; margin: 0 -16px; padding-left:16px; padding-right:16px;
  }
  .totalbar{
    display:flex; justify-content:space-between; align-items:center;
    background: var(--surface-raised); border:1px solid var(--hairline);
    border-radius: var(--radius); padding: 12px 16px; margin-bottom:10px;
  }
  .totalbar .amt{ font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; color: var(--gold); }
  .btn-primary{
    width:100%; background: var(--gold); color:#241705; border:none;
    padding: 14px; border-radius: var(--radius); font-size:15px; font-weight:700;
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  .btn-primary:disabled{ opacity:0.4; }
  .btn-primary:active:not(:disabled){ transform: scale(0.985); }
  .btn-secondary{
    width:100%; background:transparent; color:var(--cream); border:1px solid var(--hairline);
    padding: 12px; border-radius: var(--radius); font-size:14px; font-weight:600; cursor:pointer;
  }
  .btn-danger-text{ color: var(--danger); background:none; border:none; font-size:12.5px; font-weight:600; cursor:pointer; padding:6px 0; }

  /* Sales log */
  .sale-card{ cursor:pointer; }
  .sale-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .sale-customer{ font-weight:600; font-size:15px; }
  .sale-when{ font-size:11px; color:var(--cream-dim); margin-top:2px; }
  .sale-amt{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--gold); font-size:15px; }
  .sale-details{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--hairline); display:none; }
  .sale-details.open{ display:block; }
  .sale-item-line{ display:flex; justify-content:space-between; font-size:13px; padding:3px 0; color:var(--cream-dim); }

  /* Stock table */
  .stock-row{ display:flex; align-items:center; padding:10px 0; border-bottom:1px solid var(--hairline); gap:10px; }
  .stock-row:last-child{ border-bottom:none; }
  .stock-num{ text-align:right; font-family:'IBM Plex Mono',monospace; font-size:13px; width:44px; flex-shrink:0; }
  .stock-badge{ font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; margin-left:6px; }
  .stock-badge.warn{ background: rgba(217,102,106,0.2); color: var(--danger); }
  .stock-badge.zero{ background: var(--danger); color:#2a0e10; }
  .col-head{ display:flex; font-size:10px; text-transform:uppercase; letter-spacing:0.4px; color:var(--cream-dim); padding-bottom:6px; border-bottom: 1px solid var(--hairline); margin-bottom:2px; }

  /* Dashboard stat */
  .stat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:12px; }
  .stat{ background:var(--surface); border:1px solid var(--hairline); border-radius: var(--radius); padding:14px; }
  .stat .stat-label{ font-size:10.5px; text-transform:uppercase; color:var(--cream-dim); letter-spacing:0.4px; }
  .stat .stat-val{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; color:var(--gold); margin-top:4px; }
  .bar-row{ margin-bottom:10px; }
  .bar-label{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; }
  .bar-track{ height:7px; background:var(--bg-deep); border-radius:4px; overflow:hidden; }
  .bar-fill{ height:100%; background: var(--gold); border-radius:4px; }

  .empty{ text-align:center; padding: 40px 20px; color: var(--cream-dim); }
  .empty .icon{ font-size:28px; margin-bottom:8px; opacity:0.6; }

  /* Bottom nav */
  nav.bottom-nav{
    position: fixed; bottom:0; left:50%; transform: translateX(-50%);
    width:100%; max-width:480px;
    background: var(--bg-deep); border-top: 1px solid var(--hairline);
    display:flex; justify-content:space-around; padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index: 30;
  }
  .nav-btn{
    background:none; border:none; color: var(--cream-dim); display:flex; flex-direction:column;
    align-items:center; gap:3px; font-size:10.5px; font-family:'Inter',sans-serif; font-weight:500;
    cursor:pointer; padding:4px 10px; letter-spacing:0.2px;
  }
  .nav-btn svg{ width:20px; height:20px; }
  .nav-btn.active{ color: var(--gold); }
  .nav-btn.active svg{ filter: drop-shadow(0 0 6px rgba(232,169,60,0.4)); }

  .toast{
    position: fixed; left:50%; bottom:90px; transform: translateX(-50%) translateY(20px);
    background: var(--surface-raised); border:1px solid var(--hairline); color:var(--cream);
    padding: 11px 18px; border-radius: 30px; font-size:13px; font-weight:500;
    opacity:0; transition: all 0.25s ease; pointer-events:none; z-index:50;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    max-width: 85%; text-align:center;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,6,10,0.6); z-index:60;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background: var(--surface); border-top:1px solid var(--hairline);
    border-radius: 18px 18px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    width:100%; max-width:480px; max-height:85vh; overflow-y:auto;
  }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .modal-head h3{ font-family:'Fraunces',serif; font-size:18px; margin:0; font-weight:600; }
  .close-x{ background:none; border:none; color:var(--cream-dim); font-size:20px; cursor:pointer; padding:4px; }

  .link-btn{ background:none; border:none; color: var(--gold); font-size:13px; font-weight:600; cursor:pointer; padding:6px 0; }
  a.tap-link{ color: var(--gold); }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand-row">
      <div>
        <div class="brand">Melissa's <span class="dot">Ledger</span></div>
        <div class="subtitle" id="subtitleText">Sales &amp; stock, live across the team</div>
      </div>
      <button class="sync-btn" id="syncBtn">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncLabel">synced</span>
      </button>
    </div>
  </header>

  <main id="main"></main>

  <nav class="bottom-nav">
    <button class="nav-btn" data-tab="sale">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1.2" fill="currentColor" stroke="none"/><circle cx="18" cy="21" r="1.2" fill="currentColor" stroke="none"/><path d="M2.5 3h2l2.2 12.2a2 2 0 0 0 2 1.6h8.1a2 2 0 0 0 2-1.6L21 7H6"/></svg>
      New Sale
    </button>
    <button class="nav-btn" data-tab="log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M8 13h8M8 17h5"/></svg>
      Log
    </button>
    <button class="nav-btn" data-tab="stock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>
      Stock
    </button>
    <button class="nav-btn" data-tab="dash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V10M11 19V4M18 19v-7"/></svg>
      Overview
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  "use strict";

  // ============================================================
  //  FIREBASE CONFIG — paste your project's config here.
  //  Get this from: Firebase Console > Project settings > your web app.
  //  See README.md for the full setup walkthrough.
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyC1neBH5o0epr8WbBGSdBgkHWFgNidEBrk",
    authDomain: "melissa-s-business.firebaseapp.com",
    databaseURL: "https://melissa-s-business-default-rtdb.firebaseio.com", // e.g. https://melissa-s-business-default-rtdb.firebaseio.com
    projectId: "melissa-s-business",
    storageBucket: "melissa-s-business.firebasestorage.app",
    messagingSenderId: "118293910748",
    appId: "1:118293910748:web:b8afcce3b0c9318b745019"
  };
  // ============================================================

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const CATEGORY_COLORS = ['tag-0','tag-1','tag-2','tag-3','tag-4'];
  function tagClassFor(cat){
    const cats = state.categories();
    const idx = cats.indexOf(cat);
    return CATEGORY_COLORS[(idx>=0?idx:0) % CATEGORY_COLORS.length];
  }

  const DEFAULT_PRODUCTS = [
    {id:'p1', category:'Grab & Go', name:'White Chocolate Macadamia Cookies', price:4.00, initialQty:6},
    {id:'p2', category:'Grab & Go', name:'Chocolate Chip Cookies', price:3.50, initialQty:6},
    {id:'p3', category:'Indulge', name:'Classic Basque Cheesecake', price:10.00, initialQty:8},
    {id:'p4', category:'Indulge', name:'Biscoff Basque Cheesecake', price:12.00, initialQty:8},
    {id:'p5', category:'Indulge', name:'Strawberry Basque Cheesecake', price:12.00, initialQty:8},
    {id:'p6', category:'Indulge', name:'Rasmalai Tres Leches Cake', price:10.00, initialQty:8},
    {id:'p7', category:"Melissa's Signature", name:'Triple Chocolate Brownies', price:8.00, initialQty:6},
    {id:'p8', category:"Melissa's Signature", name:'Tiramisu Lamingtons', price:6.00, initialQty:9},
    {id:'p9', category:"Melissa's Signature", name:'Apple Crumble Muffin', price:6.00, initialQty:6},
    {id:'p10', category:"Melissa's Signature", name:'Peach Cobbler Cheesecake Muffin', price:7.00, initialQty:12}
  ];
  const PAYMENT_MODES = ['MPaisa','Cash','IB'];

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  function money(n){ return '$' + (Math.round(n*100)/100).toFixed(2); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function todayStr(){
    const d = new Date();
    const tz = d.getTimezoneOffset()*60000;
    return new Date(d - tz).toISOString().slice(0,10);
  }
  function formatDateStr(dateStr){
    if(!dateStr) return '';
    const d = new Date(dateStr+'T00:00:00');
    return d.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric', year:'numeric'});
  }
  function formatDateShort(dateStr){
    if(!dateStr) return '';
    const d = new Date(dateStr+'T00:00:00');
    const today = todayStr();
    const y = new Date(new Date(today+'T00:00:00') - 86400000).toISOString().slice(0,10);
    if(dateStr===today) return 'Today';
    if(dateStr===y) return 'Yesterday';
    return d.toLocaleDateString([], {month:'short', day:'numeric', year:'numeric'});
  }

  const state = {
    products: [],
    sales: [],
    tab: 'sale',
    loaded: false,
    saving: false,
    saleDraft: { customer: '', payment: 'MPaisa', date: todayStr(), items: {} }, // items: {productId: qty}
    logSearch: '',
    openSaleId: null,
    productsEditMode: false,
    categories(){
      const set = [];
      this.products.forEach(p => { if(!set.includes(p.category)) set.push(p.category); });
      return set;
    },
    soldFor(productId){
      let n = 0;
      this.sales.forEach(s => { s.items.forEach(it => { if(it.productId===productId) n += it.qty; }); });
      return n;
    },
    stockFor(product){
      return product.initialQty - this.soldFor(product.id);
    }
  };

  // ---------- storage (Firebase Realtime Database) ----------
  async function persistProducts(){
    setSyncing(true);
    try{ await db.ref('products').set(state.products); }
    catch(e){ console.error(e); showToast("Couldn't save — check your connection"); }
    setSyncing(false);
  }
  async function persistSales(){
    setSyncing(true);
    try{ await db.ref('sales').set(state.sales); }
    catch(e){ console.error(e); showToast("Couldn't save — check your connection"); }
    setSyncing(false);
  }

  async function initApp(){
    setSyncing(true);
    try{
      const prodSnap = await db.ref('products').once('value');
      if(prodSnap.exists()){
        state.products = prodSnap.val();
      } else {
        state.products = DEFAULT_PRODUCTS.slice();
        await db.ref('products').set(state.products);
      }
      const salesSnap = await db.ref('sales').once('value');
      if(salesSnap.exists()){
        state.sales = salesSnap.val();
      } else {
        state.sales = [];
        await db.ref('sales').set(state.sales);
      }
      state.loaded = true;
    }catch(e){
      console.error(e);
      showToast("Couldn't connect — check your Firebase config in index.html");
    }
    setSyncing(false);
    render();

    // live listeners: any device's change reflects here automatically
    db.ref('products').on('value', snap=>{
      if(!state.loaded) return;
      state.products = snap.exists() ? snap.val() : [];
      if(!document.querySelector('.modal-overlay')) render();
    });
    db.ref('sales').on('value', snap=>{
      if(!state.loaded) return;
      state.sales = snap.exists() ? snap.val() : [];
      if(!document.querySelector('.modal-overlay')) render();
    });
  }

  function setSyncing(busy){
    const dot = document.getElementById('syncDot');
    const label = document.getElementById('syncLabel');
    if(busy){ dot.classList.add('busy'); label.textContent = 'syncing…'; }
    else{ dot.classList.remove('busy'); label.textContent = 'live'; }
  }

  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  // ---------- render router ----------
  function render(){
    document.querySelectorAll('.nav-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.tab===state.tab);
    });
    const main = document.getElementById('main');
    if(!state.loaded){
      main.innerHTML = `<div class="empty"><div class="icon">◍</div>Loading your ledger…</div>`;
      return;
    }
    if(state.tab==='sale') main.innerHTML = renderSaleTab();
    if(state.tab==='log') main.innerHTML = renderLogTab();
    if(state.tab==='stock') main.innerHTML = renderStockTab();
    if(state.tab==='dash') main.innerHTML = renderDashTab();
    bindTabEvents();
  }

  // ---------- NEW SALE TAB ----------
  function saleDraftTotal(){
    let total = 0;
    Object.keys(state.saleDraft.items).forEach(pid=>{
      const p = state.products.find(x=>x.id===pid);
      if(p) total += p.price * state.saleDraft.items[pid];
    });
    return total;
  }

  function renderSaleTab(){
    const cats = state.categories();
    const productsHtml = cats.map(cat=>{
      const items = state.products.filter(p=>p.category===cat);
      const rows = items.map(p=>{
        const stock = state.stockFor(p);
        const qty = state.saleDraft.items[p.id] || 0;
        const low = stock<=2;
        return `
        <div class="product-row">
          <div class="p-info">
            <div class="p-name">${escapeHtml(p.name)}</div>
            <div class="p-meta ${low?'low':''}">${money(p.price)} · ${stock<=0?'out of stock':stock+' left'}</div>
          </div>
          <div class="stepper">
            <button class="step-btn" data-act="dec" data-id="${p.id}" ${qty<=0?'disabled':''}>−</button>
            <div class="step-count num">${qty}</div>
            <button class="step-btn" data-act="inc" data-id="${p.id}" ${qty>=stock?'disabled':''}>+</button>
          </div>
        </div>`;
      }).join('');
      return `
      <div class="card">
        <span class="tag ${tagClassFor(cat)}" style="margin-bottom:8px;">${escapeHtml(cat)}</span>
        ${rows}
      </div>`;
    }).join('');

    const total = saleDraftTotal();
    const itemCount = Object.values(state.saleDraft.items).reduce((a,b)=>a+b,0);
    const canSubmit = state.saleDraft.customer.trim().length>0 && itemCount>0;

    return `
      <div class="section-title">New sale</div>
      <div class="card">
        <div class="field">
          <label>Customer</label>
          <input type="text" id="custInput" placeholder="e.g. Andrew, or Henry &amp; Keli" value="${escapeHtml(state.saleDraft.customer)}">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Date</label>
            <input type="date" id="dateInput" value="${escapeHtml(state.saleDraft.date)}">
          </div>
          <div class="field">
            <label>Payment mode</label>
            <div class="chip-group">
              ${PAYMENT_MODES.map(m=>`<button class="chip ${state.saleDraft.payment===m?'active':''}" data-payment="${m}">${m}</button>`).join('')}
            </div>
          </div>
        </div>
      </div>
      ${productsHtml}
      <div class="sticky-bottom">
        <div class="totalbar">
          <div>
            <div style="font-size:11px;color:var(--cream-dim);text-transform:uppercase;letter-spacing:0.4px;">Total (${itemCount} item${itemCount===1?'':'s'})</div>
          </div>
          <div class="amt">${money(total)}</div>
        </div>
        <button class="btn-primary" id="completeSaleBtn" ${canSubmit?'':'disabled'}>Complete sale</button>
      </div>
    `;
  }

  async function completeSale(){
    const items = Object.keys(state.saleDraft.items)
      .filter(pid=>state.saleDraft.items[pid]>0)
      .map(pid=>{
        const p = state.products.find(x=>x.id===pid);
        return { productId: pid, name: p.name, price: p.price, qty: state.saleDraft.items[pid] };
      });
    if(items.length===0) return;
    const total = items.reduce((a,it)=>a+it.price*it.qty,0);
    const sale = {
      id: uid(),
      customer: state.saleDraft.customer.trim(),
      payment: state.saleDraft.payment,
      date: state.saleDraft.date || todayStr(),
      items,
      total,
      timestamp: Date.now()
    };
    setSyncing(true);
    state.sales.push(sale);
    await persistSales();
    setSyncing(false);
    showReceiptModal(sale);
    state.saleDraft = { customer:'', payment:'MPaisa', date: todayStr(), items:{} };
    render();
  }

  function showReceiptModal(sale){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" style="background:transparent;border:none;padding-bottom:calc(28px + env(safe-area-inset-bottom));">
        <div class="receipt">
          <div class="receipt-head">Sale recorded<small>${formatDateStr(sale.date)}</small></div>
          ${sale.items.map(it=>`<div class="receipt-line"><span class="ln-name">${it.qty} × ${escapeHtml(it.name)}</span><span>${money(it.price*it.qty)}</span></div>`).join('')}
          <div class="receipt-total"><span>${escapeHtml(sale.customer)}</span><span>${money(sale.total)}</span></div>
          <div class="receipt-foot">${sale.payment}</div>
        </div>
        <button class="btn-primary" style="margin-top:20px;" id="closeReceiptBtn">Done</button>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector('#closeReceiptBtn').onclick = ()=> overlay.remove();
    overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  }

  // ---------- SALES LOG TAB ----------
  function saleDateStr(s){
    return s.date || new Date(s.timestamp).toISOString().slice(0,10);
  }

  function renderLogTab(){
    const q = state.logSearch.trim().toLowerCase();
    let sales = state.sales.slice().sort((a,b)=>b.timestamp-a.timestamp);
    if(q) sales = sales.filter(s=>s.customer.toLowerCase().includes(q));
    const grandTotal = state.sales.reduce((a,s)=>a+s.total,0);

    if(state.sales.length===0){
      return `
        <div class="section-title">Sales log</div>
        <div class="empty"><div class="icon">🧾</div>No sales yet.<br>Log your first sale from the New Sale tab.</div>
      `;
    }

    // group by date, most recent date first
    const dateOrder = [];
    const byDate = {};
    sales.forEach(s=>{
      const d = saleDateStr(s);
      if(!byDate[d]){ byDate[d]=[]; dateOrder.push(d); }
      byDate[d].push(s);
    });

    const groupsHtml = dateOrder.map(d=>{
      const daySales = byDate[d];
      const dayTotal = daySales.reduce((a,s)=>a+s.total,0);
      const cardsHtml = daySales.map(s=>{
        const open = state.openSaleId===s.id;
        return `
        <div class="card sale-card" data-sale-id="${s.id}">
          <div class="sale-top">
            <div>
              <div class="sale-customer">${escapeHtml(s.customer)}</div>
              <div class="sale-when">${new Date(s.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} · ${s.payment}</div>
            </div>
            <div class="sale-amt">${money(s.total)}</div>
          </div>
          <div class="sale-details ${open?'open':''}">
            ${s.items.map(it=>`<div class="sale-item-line"><span>${it.qty} × ${escapeHtml(it.name)}</span><span>${money(it.price*it.qty)}</span></div>`).join('')}
            <button class="btn-danger-text" data-void="${s.id}">Void this sale</button>
          </div>
        </div>`;
      }).join('');
      return `
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px;">
        <div class="p-name" style="font-family:'Fraunces',serif;font-size:14.5px;">${formatDateShort(d)}</div>
        <div class="muted num" style="font-size:12.5px;">${daySales.length} sale${daySales.length===1?'':'s'} · ${money(dayTotal)}</div>
      </div>
      ${cardsHtml}`;
    }).join('');

    return `
      <div class="section-title">Sales log</div>
      <div class="field" style="margin-bottom:14px;">
        <input type="text" id="logSearchInput" placeholder="Search by customer…" value="${escapeHtml(state.logSearch)}">
      </div>
      <div class="stat" style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;">
        <span class="muted" style="font-size:12.5px;text-transform:uppercase;letter-spacing:0.4px;">Grand total</span>
        <span class="num" style="font-size:19px;font-weight:600;color:var(--gold);">${money(grandTotal)}</span>
      </div>
      ${groupsHtml || `<div class="empty">No sales match "${escapeHtml(state.logSearch)}"</div>`}
    `;
  }

  async function voidSale(id){
    if(!confirm('Void this sale? This will restore the stock and cannot be undone.')) return;
    setSyncing(true);
    state.sales = state.sales.filter(s=>s.id!==id);
    await persistSales();
    setSyncing(false);
    showToast('Sale voided');
    render();
  }

  // ---------- STOCK TAB ----------
  function renderStockTab(){
    const cats = state.categories();
    const groups = cats.map(cat=>{
      const items = state.products.filter(p=>p.category===cat);
      const rows = items.map(p=>{
        const sold = state.soldFor(p.id);
        const stock = state.stockFor(p);
        let badge = '';
        if(stock<=0) badge = `<span class="stock-badge zero">OUT</span>`;
        else if(stock<=2) badge = `<span class="stock-badge warn">LOW</span>`;
        return `
        <div class="stock-row">
          <div style="flex:1;min-width:0;">
            <div class="p-name">${escapeHtml(p.name)} ${badge}</div>
            <div class="p-meta">${money(p.price)} each</div>
          </div>
          <div class="stock-num">${p.initialQty}</div>
          <div class="stock-num">${sold}</div>
          <div class="stock-num" style="color:${stock<=0?'var(--danger)':stock<=2?'var(--gold)':'var(--cream)'};font-weight:600;">${stock}</div>
          ${state.productsEditMode?`<button class="close-x" data-edit-product="${p.id}" style="font-size:15px;">✎</button>`:''}
        </div>`;
      }).join('');
      return `
      <div class="card">
        <span class="tag ${tagClassFor(cat)}" style="margin-bottom:8px;">${escapeHtml(cat)}</span>
        <div class="col-head">
          <div style="flex:1;">Item</div><div class="stock-num">Qty</div><div class="stock-num">Sold</div><div class="stock-num">Left</div>${state.productsEditMode?'<div style="width:28px;"></div>':''}
        </div>
        ${rows}
      </div>`;
    }).join('');

    return `
      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
        <span>Stock</span>
        <button class="link-btn" id="toggleEditBtn">${state.productsEditMode?'Done':'Manage products'}</button>
      </div>
      ${groups}
      ${state.productsEditMode?`<button class="btn-secondary" id="addProductBtn">+ Add product</button>`:''}
    `;
  }

  function openProductModal(product){
    const isNew = !product;
    const cats = state.categories();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <div class="modal-head">
          <h3>${isNew?'Add product':'Edit product'}</h3>
          <button class="close-x" id="modalClose">✕</button>
        </div>
        <div class="field">
          <label>Name</label>
          <input type="text" id="pmName" value="${product?escapeHtml(product.name):''}" placeholder="e.g. Lemon Bars">
        </div>
        <div class="field">
          <label>Category</label>
          <input type="text" id="pmCategory" list="catList" value="${product?escapeHtml(product.category):(cats[0]||'')}" placeholder="e.g. Indulge">
          <datalist id="catList">${cats.map(c=>`<option value="${escapeHtml(c)}">`).join('')}</datalist>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Price ($)</label>
            <input type="number" id="pmPrice" step="0.01" min="0" value="${product?product.price:''}">
          </div>
          <div class="field">
            <label>Stock qty</label>
            <input type="number" id="pmQty" step="1" min="0" value="${product?product.initialQty:''}">
          </div>
        </div>
        <button class="btn-primary" id="pmSave">${isNew?'Add product':'Save changes'}</button>
        ${!isNew?`<button class="btn-danger-text" id="pmDelete" style="width:100%;text-align:center;margin-top:10px;">Delete product</button>`:''}
      </div>
    `;
    document.body.appendChild(overlay);
    const close = ()=> overlay.remove();
    overlay.querySelector('#modalClose').onclick = close;
    overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });

    overlay.querySelector('#pmSave').onclick = async ()=>{
      const name = overlay.querySelector('#pmName').value.trim();
      const category = overlay.querySelector('#pmCategory').value.trim() || 'Uncategorized';
      const price = parseFloat(overlay.querySelector('#pmPrice').value);
      const qty = parseInt(overlay.querySelector('#pmQty').value, 10);
      if(!name || isNaN(price) || price<0 || isNaN(qty) || qty<0){
        showToast('Please fill in all fields correctly');
        return;
      }
      setSyncing(true);
      if(isNew){
        state.products.push({ id: uid(), category, name, price, initialQty: qty });
      } else {
        const p = state.products.find(x=>x.id===product.id);
        p.name=name; p.category=category; p.price=price; p.initialQty=qty;
      }
      await persistProducts();
      setSyncing(false);
      close();
      showToast(isNew?'Product added':'Product updated');
      render();
    };
    if(!isNew){
      overlay.querySelector('#pmDelete').onclick = async ()=>{
        if(!confirm(`Delete "${product.name}"? Past sales will keep the record, but it will disappear from Stock and New Sale.`)) return;
        setSyncing(true);
        state.products = state.products.filter(x=>x.id!==product.id);
        await persistProducts();
        setSyncing(false);
        close();
        showToast('Product deleted');
        render();
      };
    }
  }

  // ---------- DASHBOARD TAB ----------
  function renderDashTab(){
    if(state.sales.length===0){
      return `
        <div class="section-title">Overview</div>
        <div class="empty"><div class="icon">✦</div>No sales recorded yet.<br>Your dashboard will fill in once you start selling.</div>
      `;
    }
    const grandTotal = state.sales.reduce((a,s)=>a+s.total,0);
    const count = state.sales.length;
    const byPayment = {};
    PAYMENT_MODES.forEach(m=>byPayment[m]={count:0,total:0});
    state.sales.forEach(s=>{
      if(!byPayment[s.payment]) byPayment[s.payment]={count:0,total:0};
      byPayment[s.payment].count++;
      byPayment[s.payment].total += s.total;
    });
    const maxPay = Math.max(...Object.values(byPayment).map(v=>v.total), 1);

    const byDate = {};
    state.sales.forEach(s=>{
      const d = saleDateStr(s);
      if(!byDate[d]) byDate[d] = {count:0, total:0};
      byDate[d].count++;
      byDate[d].total += s.total;
    });
    const dateEntries = Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).slice(0,10);
    const maxDate = Math.max(...dateEntries.map(d=>byDate[d].total), 1);

    const soldMap = {};
    state.products.forEach(p=> soldMap[p.id] = { name:p.name, sold: state.soldFor(p.id) });
    const top = Object.values(soldMap).sort((a,b)=>b.sold-a.sold).filter(x=>x.sold>0).slice(0,5);
    const maxSold = Math.max(...top.map(t=>t.sold), 1);

    const lowStock = state.products.filter(p=>state.stockFor(p)<=2);

    return `
      <div class="section-title">Overview</div>
      <div class="stat-grid">
        <div class="stat"><div class="stat-label">Grand total</div><div class="stat-val">${money(grandTotal)}</div></div>
        <div class="stat"><div class="stat-label">Sales logged</div><div class="stat-val">${count}</div></div>
      </div>

      <div class="card">
        <div class="p-name" style="margin-bottom:10px;">By payment mode</div>
        ${Object.keys(byPayment).map(m=>{
          const v = byPayment[m];
          return `
          <div class="bar-row">
            <div class="bar-label"><span>${m} · ${v.count} sale${v.count===1?'':'s'}</span><span class="num">${money(v.total)}</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${(v.total/maxPay*100).toFixed(1)}%;"></div></div>
          </div>`;
        }).join('')}
      </div>

      <div class="card">
        <div class="p-name" style="margin-bottom:10px;">By date${dateEntries.length>=10?' (last 10 days)':''}</div>
        ${dateEntries.map(d=>{
          const v = byDate[d];
          return `
          <div class="bar-row">
            <div class="bar-label"><span>${formatDateShort(d)} · ${v.count} sale${v.count===1?'':'s'}</span><span class="num">${money(v.total)}</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${(v.total/maxDate*100).toFixed(1)}%;background:var(--slate);"></div></div>
          </div>`;
        }).join('')}
      </div>

      ${top.length? `
      <div class="card">
        <div class="p-name" style="margin-bottom:10px;">Top sellers</div>
        ${top.map(t=>`
          <div class="bar-row">
            <div class="bar-label"><span>${escapeHtml(t.name)}</span><span class="num">${t.sold} sold</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${(t.sold/maxSold*100).toFixed(1)}%;background:var(--sage);"></div></div>
          </div>`).join('')}
      </div>`:''}

      ${lowStock.length? `
      <div class="card">
        <div class="p-name" style="margin-bottom:8px;color:var(--danger);">⚠ Low or out of stock</div>
        ${lowStock.map(p=>`<div class="stock-row"><div style="flex:1;">${escapeHtml(p.name)}</div><div class="stock-num" style="color:var(--danger);font-weight:600;">${state.stockFor(p)} left</div></div>`).join('')}
      </div>`:''}
    `;
  }

  // ---------- events ----------
  function bindTabEvents(){
    const main = document.getElementById('main');

    if(state.tab==='sale'){
      const cust = document.getElementById('custInput');
      if(cust){
        cust.oninput = e=>{ state.saleDraft.customer = e.target.value; updateSubmitState(); };
      }
      const dateInp = document.getElementById('dateInput');
      if(dateInp){
        dateInp.onchange = e=>{ state.saleDraft.date = e.target.value || todayStr(); };
      }
      main.querySelectorAll('[data-payment]').forEach(btn=>{
        btn.onclick = ()=>{ state.saleDraft.payment = btn.dataset.payment; render(); focusRestore('sale'); };
      });
      main.querySelectorAll('[data-act]').forEach(btn=>{
        btn.onclick = ()=>{
          const id = btn.dataset.id;
          const act = btn.dataset.act;
          const p = state.products.find(x=>x.id===id);
          const cur = state.saleDraft.items[id] || 0;
          const stock = state.stockFor(p);
          if(act==='inc' && cur<stock) state.saleDraft.items[id] = cur+1;
          if(act==='dec' && cur>0){
            state.saleDraft.items[id] = cur-1;
            if(state.saleDraft.items[id]===0) delete state.saleDraft.items[id];
          }
          render();
        };
      });
      const completeBtn = document.getElementById('completeSaleBtn');
      if(completeBtn) completeBtn.onclick = completeSale;
    }

    if(state.tab==='log'){
      const search = document.getElementById('logSearchInput');
      if(search){
        search.oninput = e=>{ state.logSearch = e.target.value; render(); focusRestore('log'); };
      }
      main.querySelectorAll('.sale-card').forEach(card=>{
        card.addEventListener('click', e=>{
          if(e.target.dataset.void) return;
          const id = card.dataset.saleId;
          state.openSaleId = state.openSaleId===id ? null : id;
          render();
        });
      });
      main.querySelectorAll('[data-void]').forEach(btn=>{
        btn.onclick = e=>{ e.stopPropagation(); voidSale(btn.dataset.void); };
      });
    }

    if(state.tab==='stock'){
      const toggleBtn = document.getElementById('toggleEditBtn');
      if(toggleBtn) toggleBtn.onclick = ()=>{ state.productsEditMode = !state.productsEditMode; render(); };
      const addBtn = document.getElementById('addProductBtn');
      if(addBtn) addBtn.onclick = ()=> openProductModal(null);
      main.querySelectorAll('[data-edit-product]').forEach(btn=>{
        btn.onclick = ()=>{
          const p = state.products.find(x=>x.id===btn.dataset.editProduct);
          openProductModal(p);
        };
      });
    }
  }

  function updateSubmitState(){
    const btn = document.getElementById('completeSaleBtn');
    if(!btn) return;
    const itemCount = Object.values(state.saleDraft.items).reduce((a,b)=>a+b,0);
    btn.disabled = !(state.saleDraft.customer.trim().length>0 && itemCount>0);
  }

  function focusRestore(tab){
    // keep focus on inputs after minor re-renders where possible (no-op placeholder for future enhancement)
  }

  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.tab = btn.dataset.tab;
      state.openSaleId = null;
      render();
      window.scrollTo(0,0);
    });
  });

  document.getElementById('syncBtn').addEventListener('click', ()=>{
    // manual nudge: re-render from current live data, useful if the UI ever looks stuck
    setSyncing(true);
    setTimeout(()=>{ setSyncing(false); render(); }, 300);
  });

  initApp();
})();
</script>
</body>
</html>
